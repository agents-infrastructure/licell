roadmap: ecs-lifecycle-operations
created: 2026-07-03

items:
  - slug: ecs-lifecycle-start-reboot
    description: 建 lifecycle 命令 harness（plan/dry-run/precheck/verify）与非删除语义高危确认 helper，落地 ecs start 与 ecs reboot，扩展 Start/Reboot provider wrapper 与 RAM action
    depends_on: []
    status: done
    feature: 2026-07-03-ecs-lifecycle-start-reboot
    minimal_loop: true
    notes: 最小闭环；harness 设计为 stop/delete 可复用；必须包含 dry-run 不调 mutating provider、EcsStatusClass 状态归一 precheck/幂等、bounded polling verify（transitional 不误判失败、超时 timedOut）、start 非交互免确认而 reboot 非交互需 --yes、确认文案不含删除语义、RAM 只加 StartInstance/RebootInstance、guard 测试从只暴露 list/info 更新为含 start/reboot；design 建议先做 harness+provider 契约测试再接 start 再接 reboot 确认（RMR-006）

  - slug: ecs-lifecycle-stop
    description: 落地 ecs stop 命令，复用 harness 与高危确认 helper，扩展 StopInstance provider 与 RAM action
    depends_on: [ecs-lifecycle-start-reboot]
    status: done
    feature: 2026-07-03-ecs-lifecycle-stop
    minimal_loop: false
    notes: safety.level=destructive；precheck running-like 并提示业务中断；非交互需显式确认 flag；dry-run plan shape 稳定；RAM 只加 StopInstance

  - slug: ecs-lifecycle-delete
    description: 落地 ecs rm/delete 命令，复用 harness，接 ensureDestructiveActionConfirmed 双确认，扩展 DeleteInstance provider 与 RAM action
    depends_on: [ecs-lifecycle-start-reboot]
    status: done
    feature: 2026-07-03-ecs-lifecycle-delete
    minimal_loop: false
    notes: safety.level=destructive；--yes + 双确认；delete preflight 必须调 getEcsInstanceReleaseFacts 读删除保护/磁盘/释放行为，事实不可读时阻断执行而非放行（RMR-001）；plan.releaseFacts 显式；verify 以 not-found 为删除终态；RAM DeleteInstance（+ 只读 DescribeDisks 等）与 start/reboot 分开 review

  - slug: ecs-lifecycle-surface-harden
    description: 整体命令 surface 同步与回归收口，让 catalog/help/completion/README/agent-surface/skill scaffold 反映最终 lifecycle 命令集
    depends_on: [ecs-lifecycle-stop, ecs-lifecycle-delete]
    status: in-progress
    feature: 2026-07-03-ecs-lifecycle-surface-harden
    minimal_loop: false
    notes: 运行 bun run docs:sync/docs:check；统一回归 dry-run/确认/verify 契约；更新 ecs-lifecycle-command-seeds 状态；不新增用户命令
