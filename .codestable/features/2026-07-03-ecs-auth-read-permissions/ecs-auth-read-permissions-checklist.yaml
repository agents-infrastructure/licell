feature: 2026-07-03-ecs-auth-read-permissions
created: 2026-07-03

steps:
  - action: "Capability contract：新增 ecs capability、label 和只读 action hints"
    exit_signal: "resolveAuthCapabilityActions(['ecs']) 返回且仅返回 ecs:DescribeInstanceAttribute / ecs:DescribeInstances，AUTH_CAPABILITY_LABELS.ecs 非空；ram-bootstrap.test.ts 的 capability coverage 数组包含 ecs"
    status: done
  - action: "Bootstrap policy：把 ECS Describe action 加入默认 RAM policy"
    exit_signal: "policy document 包含两个 ECS Describe action、保留 ecs:DescribeSecurityGroups / ecs:CreateSecurityGroup；ram-bootstrap.test.ts 负向断言不包含 ecs:StartInstance/StopInstance/RebootInstance/DeleteInstance/RunInstances"
    status: done
  - action: "Doctor optional probe：把 ECS 接入 doctor capability order 与 probe"
    exit_signal: "doctor-cloud.test.ts 断言 ecs 恒在 optional 且不在 required；mock ../providers/ecs 后调用 exported runCapabilityProbe(auth, 'ecs', false)，可观察 listEcsInstances({ limit: 1 }) 并返回 ok"
    status: done
  - action: "Migration / warn characterization：锁定旧 bootstrap operator 的诊断行为"
    exit_signal: "doctor-cloud.test.ts mock listEcsInstances 抛 AccessDenied 后调用 runCapabilityProbe(auth, 'ecs', false) 返回 warn；汇总后 nextActions 包含 licell auth repair，且 ECS 不被标记为 required error"
    status: done
  - action: "Validation cleanup：运行核心验证并确认 scope 未漂移"
    exit_signal: "typecheck、auth/RAM/doctor vitest、doctor-cloud integration test、checklist yaml 校验通过，diff 不包含 ECS 命令注册/generated docs/mutating ECS action"
    status: done

