feature: 2026-07-03-ecs-readonly-provider
created: 2026-07-03

steps:
  - action: "SDK/type precheck：确认 DescribeInstancesRequest 和 response model 的真实字段名"
    exit_signal: "按 lockfile 恢复依赖环境后 bun run typecheck 真实通过；字段语义不可用只能触发 surface 修订，不能作为跳过 typecheck 的成功出口"
    status: done
  - action: "Provider skeleton：建立 ECS client、types、query 和 facade 的最小结构"
    exit_signal: "测试可导入 listEcsInstances / getEcsInstanceDetail，并能 mock ECS client"
    status: done
  - action: "Filter request builder：实现 region、limit 和 filters 到 DescribeInstancesRequest 的映射"
    exit_signal: "单测断言 instanceIds/name/namePrefix/status/vpc/vsw/zone/type/charge/tag/IP request shape；mock 返回不匹配 filter 的实例时 provider 原样返回，证明没有 post-filter"
    status: done
  - action: "Pagination and summary normalization：实现受控分页、truncated 计算和 EcsInstanceSummary 白名单映射"
    exit_signal: "单测覆盖多页、limit、totalCount、空页、20 页上限、数组字段归一化、tags tagKey/tagValue 转 key/value 和敏感字段缺席"
    status: done
  - action: "Detail and not-found：实现 getEcsInstanceDetail 的 instanceIds 查询和 not-found 错误"
    exit_signal: "单测覆盖 found、empty result not-found、空 instanceId input error；断言 not-found message/code 含 not exist/notfound/no such 且 isNotFoundError/output category=not_found 可识别"
    status: done
  - action: "Validation cleanup：运行核心验证并确认 scope 没有漂移到 command/auth/docs"
    exit_signal: "typecheck、ecs-provider test、checklist yaml 校验通过，git diff 不包含 command/auth/docs 实现"
    status: done

checks:
  - item: "不注册 licell ecs 命令，不修改 command registry/help/catalog/docs"
    source: 范围守护
    status: passed
  - item: "不新增 AuthCapability、RAM policy action 或 doctor capability order"
    source: 范围守护
    status: passed
  - item: "不调用 StartInstance/StopInstance/RebootInstance/DeleteInstance/RunInstances/Cloud Assistant/VNC/console/userData/password/key pair 私钥相关 API"
    source: 范围守护
    status: passed
  - item: "createEcsClient(regionId?) 使用显式 region 或 Config.requireAuth().region，并构造 ecs.${regionId}.aliyuncs.com endpoint"
    source: 名词契约
    status: passed
  - item: "createEcsClient / EcsClientContext 作为有意导出的低层 provider seam，EcsClient 类型来源为 @alicloud/ecs20140526"
    source: 名词契约
    status: passed
  - item: "listEcsInstances 返回 regionId、filters、totalCount、count、limit、truncated、instances，不泄漏 SDK raw response"
    source: 名词契约
    status: passed
  - item: "getEcsInstanceDetail 只返回基础 summary，空结果抛出的 message/code 包含 not exist/notfound/no such 并可归类为 not_found"
    source: 名词契约
    status: passed
  - item: "instanceIds/name/namePrefix/status/vpc/vsw/zone/instanceType/chargeType/tag/privateIp/publicIp/eip 均映射到 ECS 服务端 request，不做分页后本地过滤"
    source: 编排骨架
    status: passed
  - item: "name 与 namePrefix 互斥，同时传入时报 input error，错误消息包含无效/invalid 等可分类 token"
    source: 流程级约束
    status: passed
  - item: "分页最多 20 页，provider limit 防御到 1..500，并正确计算 truncated"
    source: 流程级约束
    status: passed
  - item: "EcsInstanceSummary 只包含 roadmap 白名单字段，数组字段为空时返回 []，tags 从 tagKey/tagValue 归一到 key/value"
    source: 验收场景
    status: passed
  - item: "mock SDK 返回不匹配 filter 的实例时 provider 原样返回，证明 provider 不做 post-filter"
    source: 验收场景
    status: passed
  - item: "publicIpAddress filter 的 VPC 语义风险不得用本地过滤补齐；若语义不可靠，传递给后续 command surface 调整"
    source: 流程级约束
    status: passed
  - item: "provider 查询无副作用，不写 .licell/project.json、.licell/state.json 或 workspace component 配置"
    source: 验收场景
    status: passed
  - item: "src/providers/ecs.ts facade 暴露 ECS provider public surface，后续 command/doctor 通过该 surface 消费"
    source: 挂载点
    status: passed

dod:
  commands:
    - id: CMD-001
      command: "bun run typecheck"
      core: true
      failure_handling: fix-or-block
    - id: CMD-002
      command: "bun x vitest run src/__tests__/ecs-provider.test.ts"
      core: true
      failure_handling: fix-or-block
    - id: CMD-003
      command: "python3 .codestable/tools/validate-yaml.py --file .codestable/features/2026-07-03-ecs-readonly-provider/ecs-readonly-provider-checklist.yaml --yaml-only"
      core: false
      failure_handling: fix-or-block
  evidence_required: [command_output, diff_summary, review_report, qa_report, acceptance_report]
  cleanliness:
    debug_output: forbidden
    todo_comments: forbidden
    commented_code: forbidden
    unused_imports: forbidden
