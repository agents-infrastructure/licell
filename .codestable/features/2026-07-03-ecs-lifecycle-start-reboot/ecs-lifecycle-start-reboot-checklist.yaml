    exit_signal: "单测覆盖 dry-run willExecute=false 且 mutating 未被调用（含 reboot --dry-run 无 --yes 不确认不 mutating）、start precheck stopped-like/已 running 幂等、reboot precheck running-like 为可执行态非幂等、transitional 超时 timedOut=true 非失败；stop/delete 分支标 not-implemented 不注册命令"
