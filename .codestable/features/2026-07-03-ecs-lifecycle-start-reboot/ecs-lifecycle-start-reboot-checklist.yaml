    status: done
  - action: "RAM 与 guard：CAPABILITY_ACTIONS.ecs 与 LICELL_POLICY_ACTIONS 追加 Start/Reboot；更新 guard 断言为含 start/reboot 仍不含 stop/delete"
    exit_signal: "auth-recovery/ram-bootstrap 测试断言含 StartInstance/RebootInstance 不含 Stop/Delete；manifest/help/completion guard 更新为暴露 start/reboot 不暴露 stop/delete/rm/run/create"
    status: done
  - action: "验证收口：跑核心验证并确认 scope 未漂移"
    exit_signal: "typecheck、ecs-lifecycle tests、manifest/help/completion/auth/ram tests、checklist yaml 校验通过；diff 无 generated docs 手改、无 stop/delete/run/create 命令注册"
    status: done

