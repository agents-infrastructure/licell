    exit_signal: "单测断言文案不含删除语义、非交互无 --yes 抛错并指明 flag、交互确认路径"
    status: done
  - action: "命令与 descriptor：注册 ecs start / ecs reboot，safety 显式（start=mutating 免确认、reboot=mutating confirmFlags=['--yes']），recommendedFlow 覆盖 dry-run→execute→verify"
